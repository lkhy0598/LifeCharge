<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Database 結帳畫面測試</title>
</head>

<body>
    <div id="app">正在初始化…</div>

    <script type="module">
        import { createApp, h, ref } from 'vue'
        import { createPinia } from 'pinia'
        import {
            createRouter,
            createMemoryHistory,
            RouterView,
        } from 'vue-router'
        import { createVuetify } from 'vuetify'
        import * as components from 'vuetify/components'

        import 'vuetify/styles'
        import '@mdi/font/css/materialdesignicons.css'
        import '../../src/assets/styles/style.scss'

        import Checkout from '../../src/views/Checkout.vue'
        import { useGameStore } from '../../src/stores/gameStore.js'
        import { useAuthStore } from '../../src/stores/authStore.js'
        import { useCartStore } from '../../src/stores/cartStore.js'
        import {
            createDatabaseQuote,
            createPurchaseRequestKey,
            submitDatabasePurchase,
        } from '../../src/services/purchaseService.js'

        // 預設禁止送單，勾選測試開關後才允許建立訂單。
        const allowPurchase = ref(false)
        const originalFetch = window.fetch

        window.fetch = (input, options) => {
            const address = typeof input === 'string'
                ? input
                : input instanceof URL ? input.href : input.url

            const url = new URL(address, location.href)
            const method = (
                options?.method
                ?? (input instanceof Request ? input.method : 'GET')
            ).toUpperCase()

            if (
                method === 'POST'
                && url.pathname === '/api/purchases'
                && !allowPurchase.value
            ) {
                return Promise.resolve(new Response(JSON.stringify({
                    ok: false,
                    error: {
                        code: 'TEST_PURCHASE_DISABLED',
                        message: '此測試頁禁止送單，只驗證報價與畫面。',
                    },
                }), {
                    status: 403,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                }))
            }

            return originalFetch.call(window, input, options)
        }

        const pinia = createPinia()
        const gameStore = useGameStore(pinia)
        const authStore = useAuthStore(pinia)
        const cartStore = useCartStore(pinia)

        const EmptyPage = { render: () => null }

        const router = createRouter({
            history: createMemoryHistory(),
            routes: [
                { path: '/checkout', component: Checkout },
                { path: '/', component: EmptyPage },
                { path: '/search', component: EmptyPage },
                { path: '/member', component: EmptyPage },
            ],
        })

        const vuetify = createVuetify({
            components,
            theme: {
                defaultTheme: 'light',
                themes: {
                    light: {
                        colors: {
                            primary: '#d94b39',
                            'on-primary': '#ffffff',
                        },
                    },
                },
            },
            icons: { defaultSet: 'mdi' },
        })

        try {
            await gameStore.initialize('database')
            await authStore.initialize('database')

            if (!authStore.isLoggedIn) {
                throw new Error(
                    '請先到 Phase 5 Service 頁登入 Database 會員，再重新整理。'
                )
            }

            cartStore.initialize('database')

            await router.push('/checkout')
            await router.isReady()

            const app = createApp({
                setup() {
                    const gameId = ref('3')
                    const message = ref('')

                    const parallelBusy = ref(false)

                    async function testParallelPurchase() {
                        if (parallelBusy.value) return

                        if (!allowPurchase.value) {
                            message.value = '請先勾選「允許實際建立測試訂單」。'
                            return
                        }

                        parallelBusy.value = true
                        message.value = '正在測試同時購買…'

                        try {
                            const quote = await createDatabaseQuote([
                                Number(gameId.value),
                            ])

                            // 兩個請求沿用同一個識別碼，代表同一次購買。
                            const requestKey = createPurchaseRequestKey()

                            const results = await Promise.allSettled([
                                submitDatabasePurchase(quote.quoteId, requestKey),
                                submitDatabasePurchase(quote.quoteId, requestKey),
                            ])

                            message.value = JSON.stringify({
                                requestKey,
                                results: results.map(result =>
                                    result.status === 'fulfilled'
                                        ? {
                                            success: true,
                                            orderId: result.value.order.orderId,
                                        }
                                        : {
                                            success: false,
                                            code: result.reason.code,
                                            message: result.reason.message,
                                        }
                                ),
                            }, null, 2)
                        } catch (error) {
                            message.value = error.message
                        } finally {
                            parallelBusy.value = false
                        }
                    }

                    function addGame() {
                        message.value = cartStore.addToCart(
                            Number(gameId.value)
                        )
                            ? '已加入購物車'
                            : '加入失敗：請確認遊戲存在、尚未擁有且未在購物車。'
                    }

                    return () => h(components.VApp, null, {
                        default: () => h(components.VMain, null, {
                            default: () => [
                                h('section', {
                                    style: 'padding:16px;background:#fff',
                                }, [
                                    h('h2', 'Database 結帳測試'),
                                    h('label', {
                                        style: 'display:flex;align-items:center;gap:8px;margin:12px 0',
                                    }, [
                                        h('input', {
                                            type: 'checkbox',
                                            checked: allowPurchase.value,
                                            onChange: event => {
                                                allowPurchase.value = event.target.checked
                                            },
                                        }),
                                        '允許實際建立測試訂單',
                                    ]),
                                    h('p', allowPurchase.value
                                        ? '已允許送單：確認購買後會寫入資料庫，這是模擬付款，不會實際扣款。'
                                        : '目前禁止送單：只測試畫面與報價。'
                                    ),
                                    h('p', `會員：${authStore.currentUser?.displayName}`),
                                    h('input', {
                                        value: gameId.value,
                                        'aria-label': '測試遊戲編號',
                                        style: 'border:1px solid #999;padding:8px',
                                        onInput: event => {
                                            gameId.value = event.target.value
                                        },
                                    }),
                                    h(components.VBtn, {
                                        class: 'ma-2',
                                        onClick: addGame,
                                    }, {
                                        default: () => '加入測試遊戲',
                                    }),
                                    h(components.VBtn, {
                                        class: 'ma-2',
                                        color: 'primary',
                                        loading: parallelBusy.value,
                                        disabled: !allowPurchase.value || parallelBusy.value,
                                        onClick: testParallelPurchase,
                                    }, {
                                        default: () => '測試同時送出相同購買',
                                    }),
                                    h('p', message.value),
                                ]),
                                h(RouterView),
                            ],
                        }),
                    })
                },
            })

            app.use(pinia)
            app.use(router)
            app.use(vuetify)
            app.mount('#app')
        } catch (error) {
            document.querySelector('#app').textContent =
                `初始化失敗：${error.message}`
        }
    </script>
</body>

</html>
