<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Database 註冊測試</title>
</head>
<body>
    <h1>Database 註冊測試</h1>
    <p>成功送出會新增資料庫會員，請使用虛構測試資料。</p>

    <form id="register-form">
        <p>
            <label>
                顯示名稱
                <input id="display-name" maxlength="100" required>
            </label>
        </p>
        <p>
            <label>
                帳號
                <input id="username" autocomplete="username"
                    pattern="[A-Za-z0-9_-]{3,50}" required>
            </label>
        </p>
        <p>
            <label>
                Email
                <input id="email" type="email"
                    autocomplete="email" maxlength="254" required>
            </label>
        </p>
        <p>
            <label>
                密碼
                <input id="password" type="password"
                    autocomplete="new-password" required>
            </label>
        </p>
        <p>
            <label>
                確認密碼
                <input id="confirm-password" type="password"
                    autocomplete="new-password" required>
            </label>
        </p>
        <p>密碼至少 8 字元、最多 72 bytes，不可包含空白。</p>

        <button id="submit" type="submit">測試註冊</button>
    </form>

    <pre id="result">尚未測試</pre>
    <img id="avatar" alt="新會員預設頭像"
        width="96" height="96" hidden>

    <script type="module">
        import {
            DATABASE_MEDIA_BASE_URL,
        } from '../../src/config/system.js'

        const form = document.querySelector('#register-form')
        const displayName = document.querySelector('#display-name')
        const username = document.querySelector('#username')
        const email = document.querySelector('#email')
        const password = document.querySelector('#password')
        const confirmPassword = document.querySelector('#confirm-password')
        const submit = document.querySelector('#submit')
        const output = document.querySelector('#result')
        const avatar = document.querySelector('#avatar')

        function show(value) {
            output.textContent = JSON.stringify(value, null, 2)
        }

        async function request(path, options = {}) {
            const response = await fetch(path, {
                credentials: 'same-origin',
                cache: 'no-store',
                ...options,
            })

            const payload = await response.json()

            if (!response.ok || payload.ok !== true) {
                const error = new Error(
                    `${response.status} / ${
                        payload.error?.code ?? 'UNKNOWN_ERROR'
                    }：${payload.error?.message ?? '請求失敗'}`
                )

                error.fields = payload.error?.fields
                throw error
            }

            return payload.data
        }

        form.addEventListener('submit', async event => {
            event.preventDefault()

            if (password.value !== confirmPassword.value) {
                show({ error: '兩次輸入的密碼不一致。' })
                return
            }

            submit.disabled = true
            avatar.hidden = true
            output.textContent = '正在註冊…'

            try {
                const before = await request('/api/csrf')

                const user = await request('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': before.csrfToken,
                    },
                    body: JSON.stringify({
                        displayName: displayName.value,
                        username: username.value,
                        email: email.value,
                        password: password.value,
                    }),
                })

                const after = await request('/api/csrf')
                const restored = await request('/api/me')

                show({
                    registered: true,
                    autoLoggedIn: restored.id === user.id,
                    csrfRotated:
                        before.csrfToken !== after.csrfToken,
                    noOwnedGames:
                        restored.purchasedGames.length === 0,
                    defaultAvatar:
                        restored.avatar === 'usersDataWebp/default.webp',
                    user: restored,
                })

                avatar.onload = () => {
                    avatar.hidden = false
                }

                avatar.onerror = () => {
                    output.textContent += '\n預設頭像載入失敗'
                }

                avatar.src = new URL(
                    restored.avatar,
                    DATABASE_MEDIA_BASE_URL
                ).href
            } catch (error) {
                show({
                    error: error.message,
                    fields: error.fields,
                })
            } finally {
                password.value = ''
                confirmPassword.value = ''
                submit.disabled = false
            }
        })
    </script>
</body>
</html>
